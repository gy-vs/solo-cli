# 一个 location 要同时伺候 SSE 和 WebSocket：容器终端走 ws，要 Connection: upgrade；
# 事件流和日志流是普通长连接，必须给 Connection: ""（清掉逐跳头才能保持到上游的长连）。
# 按请求有没有带 Upgrade 头分流，两者就不用各开一个 location。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 这里曾经把发起质检的两条路由挡在外面，只许 `app.cli` 在后端容器里打。后来改成
    # 录屏之前先质检（措辞在录屏前改完，省一次重录），页面上就得有这个入口，于是撤掉。
    #
    # 「点一下烧一次模型调用」那层顾虑没跟着撤，只是换了地方兜：已经有有效结论、正在跑、
    # 还没有理由正文的题在 gsb_precheck.skip_reason 那里就被剔掉，根本发不出去。
    # 整批质检走 /batch/precheck/start，起个后台任务立刻返回 —— 一百多道要跑几个小时，
    # 底下那个 3600s 的读超时也挂不住。

    # SSE、WebSocket 与长请求：关闭缓冲、拉长超时
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
