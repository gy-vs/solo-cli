# 一个 location 要同时伺候 SSE 和 WebSocket：容器终端走 ws，要 Connection: upgrade；
# 事件流和日志流是普通长连接，必须给 Connection: ""（清掉逐跳头才能保持到上游的长连）。
# 按请求有没有带 Upgrade 头分流，两者就不用各开一个 location。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # 发起提交前质检的两个口子不对浏览器开放，只能由 `app.cli` 在后端容器里打。
    # 它要在人看过录屏、准备整批提交的那一刻跑，跑早了理由还会改、结论当场过期；
    # 一个点一下就烧掉一次模型调用的按钮，摆在页面上迟早会被点。理由详见
    # backend/app/services/gsb_precheck.py 的模块说明。
    #
    # 只挡发起，不挡读取：列表和详情页要显示质检结论，走的是 /api/tasks 与
    # /api/tasks/{id}，不经过这里。人工「确认放行」是 …/precheck/confirm，正则里
    # 用 $ 收尾就是为了把它放过去 —— 那一步只有人能做。
    location ~ ^/api/tasks/(batch|[0-9]+)/precheck$ {
        return 403 '{"detail":"提交前质检只能在后端容器里用 app.cli 发起"}';
        add_header Content-Type application/json always;
    }

    # SSE、WebSocket 与长请求：关闭缓冲、拉长超时
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
