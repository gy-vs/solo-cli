# Solo CLI 控制台 · 一键启动
#
#   cp .env.example .env   # 填 CODER_ROOT（可选：CURSOR_API_KEY 等种子）
#   docker compose up --build
#   浏览器打开 http://localhost:8788
#
# backend 通过宿主机 docker.sock 创建/销毁 CC 容器；
# CODER_ROOT 必须是宿主机绝对路径（daemon 在宿主机解析 -v 路径），
# 同时挂进 backend 的 /host/coder 供轨迹解析、回填与 Cursor CLI 分析读取。

services:
  backend:
    build:
      context: ./backend
      args:
        GH_DOWNLOAD_BASE: ${GH_DOWNLOAD_BASE:-https://github.com}
    container_name: solo-cli-backend
    environment:
      - DATA_DIR=/data
      # 质检要把轨迹挂进 solo-qa 容器，docker -v 的源由宿主 daemon 解析，必须给宿主路径
      - DATA_DIR_HOST=${SOLO_CLI_ROOT:-/Users/gaoyong/solo-cli}/data
      - BRIDGE_DIR_HOST=${SOLO_CLI_ROOT:-/Users/gaoyong/solo-cli}/backend/bridges
      - CODER_ROOT_HOST=${CODER_ROOT:-/Users/gaoyong/solo-coder-0908}
      - CODER_ROOT_MOUNT=/host/coder
      - SKILL_DIR_MOUNT=/host/skills
      # 录屏文档的 PowerShell 校验要把 skill 自带的脚本挂进 powershell 容器，同样得给宿主路径
      - SKILL_DIR_HOST=${SKILL_DIR:-${HOME}/.cursor/skills}
      # 对话里跑 /solo-report 写的文档，录屏协作把里面还新鲜的片段直接发布
      - SOLO_REPORT_DOC=/host/solo-docs/SoloReport.md
      - SECRET_KEY_FILE=/data/secret.key
      - HOST_PORT=${HOST_PORT:-8788}
      # 以下为首次启动的设置种子（设置表已有值时忽略），之后在界面维护
      - CURSOR_API_KEY=${CURSOR_API_KEY:-}
      - CURSOR_MODEL=${CURSOR_MODEL:-}
      - CC_API_KEY=${CC_API_KEY:-}
      - QA_SESSION_COOKIE=${QA_SESSION_COOKIE:-}
      - QA_CSRF_TOKEN=${QA_CSRF_TOKEN:-}
      - QA_PROJECT_HOST=${QA_PROJECT_HOST:-/Users/gaoyong/solo-qa-0908}
      - GH_TOKEN=${GH_TOKEN:-}
      # 录屏和在本机启动项目都得找宿主机代理代劳，见 host-agent/
      - HOST_AGENT_URL=${HOST_AGENT_URL:-http://host.docker.internal:8790}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CODER_ROOT:-/Users/gaoyong/solo-coder-0908}:/host/coder
      # 出题 SOP：agent 在容器里读这份 skill 执行 /solo-prompt
      - ${SKILL_DIR:-${HOME}/.cursor/skills}:/host/skills:ro
      - ./data:/data
      # 挂目录不挂文件：prune / render 是整份重写，单文件挂载会一直指着旧 inode
      - ./docs:/host/solo-docs:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  frontend-console:
    build: ./frontend-console
    container_name: solo-cli-console
    environment:
      - HOST_PORT=${HOST_PORT:-8788}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-8788}:80"
    restart: unless-stopped
